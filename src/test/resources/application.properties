spring.datasource.url=jdbc:h2:mem:fantasy_league;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=test-only-signing-secret-not-for-production-use-32bytes-minimum
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=30
