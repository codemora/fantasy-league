spring.application.name=fantasy-league

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fantasy_league}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fantasy_league}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fantasy_league}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SIGNING_SECRET:dev-only-insecure-signing-secret-change-me-please-32bytes}
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=30

# Structured JSON logs on stdout (Spring Boot's built-in support, no extra
# dependency) -- fits how PaaS platforms like Render (ADR 0010) capture and
# index logs. Not applied under the test profile, which keeps the default
# human-readable console format for local debugging.
logging.structured.format.console=ecs
logging.level.com.codemora.fantasy_league=INFO
