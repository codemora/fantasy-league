spring.application.name=fantasy-league

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fantasy_league}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fantasy_league}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fantasy_league}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SIGNING_SECRET:dev-only-insecure-signing-secret-change-me-please-32bytes}
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=30
